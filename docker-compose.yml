version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - NEXT_PUBLIC_AI_ADVISOR_URL=http://localhost:8000
    depends_on:
      - api
      - ai-advisor

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/fintech
    depends_on:
      - db

  ai-advisor:
    build:
      context: ./services/ai-advisor-svc
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_TYPE=mock

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=fintech
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
