apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: atlasx
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'atlasx-production'
        environment: 'production'

    # Alertmanager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    # Load rules once and periodically evaluate them
    rule_files:
      - '/etc/prometheus/rules/*.yml'

    scrape_configs:
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # AtlasX API application metrics
      - job_name: 'atlasx-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - atlasx
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: atlasx-api
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: pod_ip

      # PostgreSQL metrics (via postgres_exporter)
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'postgres'

      # Redis metrics (via redis_exporter)
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'redis'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: atlasx
data:
  alert-rules.yml: |
    groups:
      - name: atlasx_api_alerts
        interval: 30s
        rules:
          # High error rate
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
              service: api
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.pod }}"

          # High latency
          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
            for: 10m
            labels:
              severity: warning
              service: api
            annotations:
              summary: "High API latency detected"
              description: "95th percentile latency is {{ $value }}s for {{ $labels.pod }}"

          # API down
          - alert: APIDown
            expr: up{job="atlasx-api"} == 0
            for: 2m
            labels:
              severity: critical
              service: api
            annotations:
              summary: "AtlasX API is down"
              description: "API instance {{ $labels.pod }} has been down for more than 2 minutes"

          # High memory usage
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{pod=~"atlasx-api.*"} / container_spec_memory_limit_bytes{pod=~"atlasx-api.*"} > 0.9
            for: 5m
            labels:
              severity: warning
              service: api
            annotations:
              summary: "High memory usage"
              description: "Memory usage is {{ $value | humanizePercentage }} for {{ $labels.pod }}"

          # High CPU usage
          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total{pod=~"atlasx-api.*"}[5m]) > 0.9
            for: 10m
            labels:
              severity: warning
              service: api
            annotations:
              summary: "High CPU usage"
              description: "CPU usage is {{ $value | humanizePercentage }} for {{ $labels.pod }}"

          # Database connection pool exhaustion
          - alert: DatabaseConnectionPoolExhausted
            expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
            for: 5m
            labels:
              severity: warning
              service: database
            annotations:
              summary: "Database connection pool near exhaustion"
              description: "{{ $value | humanizePercentage }} of max connections in use"

          # Redis memory high
          - alert: RedisMemoryHigh
            expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
            for: 5m
            labels:
              severity: warning
              service: redis
            annotations:
              summary: "Redis memory usage high"
              description: "Redis memory usage is {{ $value | humanizePercentage }}"

      - name: business_metrics_alerts
        interval: 1m
        rules:
          # Failed transactions spike
          - alert: FailedTransactionSpike
            expr: rate(transactions_total{status="failed"}[5m]) > 0.1
            for: 5m
            labels:
              severity: critical
              service: payments
            annotations:
              summary: "Spike in failed transactions"
              description: "Failed transaction rate is {{ $value | humanizePercentage }}"

          # KYC verification backlog
          - alert: KYCVerificationBacklog
            expr: kyc_pending_verifications > 1000
            for: 30m
            labels:
              severity: warning
              service: kyc
            annotations:
              summary: "KYC verification backlog growing"
              description: "{{ $value }} pending KYC verifications"
