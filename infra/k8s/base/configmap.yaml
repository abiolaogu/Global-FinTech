apiVersion: v1
kind: ConfigMap
metadata:
  name: atlasx-config
  namespace: atlasx
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_PORT: "3000"
  REDIS_PORT: "6379"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "atlasx"
  REDIS_DB: "0"
  JWT_EXPIRY: "15m"
  JWT_REFRESH_EXPIRY: "7d"
  RATE_LIMIT_WINDOW: "900000"
  RATE_LIMIT_MAX: "100"
  CORS_ORIGIN: "https://app.atlasx.io"
