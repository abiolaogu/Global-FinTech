apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: atlasx-secrets
  namespace: atlasx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: atlasx-cluster-secret-store
  target:
    name: atlasx-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_USER
      remoteRef:
        key: atlasx/prod/database
        property: username
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: atlasx/prod/database
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: atlasx/prod/redis
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: atlasx/prod/jwt
        property: access
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: atlasx/prod/jwt
        property: refresh
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: atlasx/prod/app
        property: encryption_key
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: atlasx/prod/monitoring
        property: grafana_admin_password
    - secretKey: ONFIDO_API_KEY
      remoteRef:
        key: atlasx/prod/integrations
        property: onfido_api_key
    - secretKey: SUMSUB_API_KEY
      remoteRef:
        key: atlasx/prod/integrations
        property: sumsub_api_key
    - secretKey: MARQETA_API_KEY
      remoteRef:
        key: atlasx/prod/integrations
        property: marqeta_api_key
    - secretKey: ALPACA_API_KEY
      remoteRef:
        key: atlasx/prod/integrations
        property: alpaca_api_key
    - secretKey: ALPACA_SECRET_KEY
      remoteRef:
        key: atlasx/prod/integrations
        property: alpaca_secret_key
