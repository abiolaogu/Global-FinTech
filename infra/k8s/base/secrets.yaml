# NOTE: In production, use Sealed Secrets, External Secrets Operator, or HashiCorp Vault
# This file should NOT contain actual secrets - use external secret management
apiVersion: v1
kind: Secret
metadata:
  name: atlasx-secrets
  namespace: atlasx
type: Opaque
stringData:
  # Database credentials
  DATABASE_USER: postgres
  DATABASE_PASSWORD: REPLACE_WITH_ACTUAL_SECRET

  # Redis credentials
  REDIS_PASSWORD: REPLACE_WITH_ACTUAL_SECRET

  # JWT secrets
  JWT_SECRET: REPLACE_WITH_ACTUAL_SECRET
  JWT_REFRESH_SECRET: REPLACE_WITH_ACTUAL_SECRET

  # External service API keys
  ONFIDO_API_KEY: REPLACE_WITH_ACTUAL_SECRET
  SUMSUB_API_KEY: REPLACE_WITH_ACTUAL_SECRET
  MARQETA_API_KEY: REPLACE_WITH_ACTUAL_SECRET
  ALPACA_API_KEY: REPLACE_WITH_ACTUAL_SECRET
  ALPACA_SECRET_KEY: REPLACE_WITH_ACTUAL_SECRET

  # Encryption keys
  ENCRYPTION_KEY: REPLACE_WITH_ACTUAL_SECRET
