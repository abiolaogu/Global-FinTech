global:
  environment: production
  region: global
  timezone: UTC

replicaCount: 3

image:
  repository: ghcr.io/global-fintech/global-fintech-api
  pullPolicy: IfNotPresent
  tag: "1.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
  hosts:
    - host: api.global-fintech.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: global-fintech-api-tls
      hosts:
        - api.global-fintech.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - atlasx
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

config:
  nodeEnv: production
  logLevel: info
  port: 3000
  coreApiEnabled: "true"
  corsOrigin: "https://app.global-fintech.example.com"
  rateLimitWindow: "900000"
  rateLimitMax: "100"
  trustedProxy: "true"

database:
  host: "postgresql-primary.database.svc.cluster.local"
  port: 5432
  name: "atlasx"
  user: "atlasx"
  sslMode: "require"

redisExternal:
  host: "redis-master.cache.svc.cluster.local"
  port: 6379

secrets:
  create: false
  existingSecret: "atlasx-runtime-secrets"
  databasePassword: "REPLACE_ME"
  redisPassword: "REPLACE_ME"
  jwtSecret: "REPLACE_ME"
  jwtRefreshSecret: "REPLACE_ME"
  encryptionKey: "REPLACE_ME"

externalSecrets:
  enabled: false
  secretStoreRef:
    name: "atlasx-cluster-secret-store"
    kind: ClusterSecretStore
  refreshInterval: 1h
  targetSecretName: "atlasx-runtime-secrets"
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: atlasx/prod/database
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: atlasx/prod/redis
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: atlasx/prod/jwt
        property: access
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: atlasx/prod/jwt
        property: refresh
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: atlasx/prod/app
        property: encryption_key

networkPolicy:
  enabled: true
  allowedIngressNamespaces:
    - ingress-nginx
  allowedMonitoringNamespaces:
    - monitoring

postgresql:
  enabled: false
  auth:
    username: atlasx
    password: "REPLACE_ME"
    database: atlasx
  primary:
    persistence:
      enabled: true
      storageClass: harvester-longhorn
      size: 100Gi

redis:
  enabled: false
  auth:
    password: "REPLACE_ME"
  master:
    persistence:
      enabled: true
      storageClass: harvester-longhorn
      size: 20Gi
