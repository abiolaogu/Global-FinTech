spring.application.name=ledger-facade-svc
server.port=8081

# Fineract API Configuration
fineract.api.url=http://localhost:8080/fineract-provider/api/v1

# Kafka Configuration
spring.kafka.producer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
