name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  aidd-guardrails:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.4
    - name: Install ripgrep
      run: sudo apt-get update && sudo apt-get install -y ripgrep
    - name: Run AIDD guardrails
      run: ./scripts/aidd-guardrail.sh

  build-and-test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./apps/web/package-lock.json
    - name: Install Dependencies
      run: npm ci
    - name: Run Lint
      run: npm run lint
    - name: Run Tests
      run: npm test -- --passWithNoTests
    - name: Build
      run: npm run build
    - name: Security Audit
      run: npm audit --audit-level=high

  build-and-test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./apps/api/package-lock.json
    - name: Install Dependencies
      run: npm ci
    - name: Run Tests
      run: npm test -- --passWithNoTests
    - name: Build
      run: npm run build
    - name: Security Audit
      run: npm audit --audit-level=high

  api-core-smoke-postgres:
    runs-on: ubuntu-latest
    needs: [build-and-test-api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasx_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d atlasx_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: ./apps/api
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./apps/api/package-lock.json
    - name: Install Dependencies
      run: npm ci
    - name: Build API
      run: npm run build
    - name: Smoke Test API Core (Postgres)
      env:
        CORE_API_ENABLED: "true"
        NODE_ENV: production
        PORT: "3000"
        DATABASE_HOST: postgres
        DATABASE_PORT: "5432"
        DATABASE_NAME: atlasx_ci
        DATABASE_USER: postgres
        DATABASE_PASSWORD: postgres
        DATABASE_SSL_MODE: disable
      run: ./scripts/core-api-postgres-smoke.sh

  build-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/ai-advisor-svc
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Mobile build would go here, but requires Flutter setup in CI
  # build-mobile:
  #   runs-on: ubuntu-latest
  #   steps:
  #   - uses: actions/checkout@v3
  #   - uses: subosito/flutter-action@v2
  #   - run: flutter build apk
